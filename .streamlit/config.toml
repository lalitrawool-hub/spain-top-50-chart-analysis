[theme]
base = "dark"
primaryColor = "#606060"
backgroundColor = "#080808"
secondaryBackgroundColor = "#111111"
textColor = "#F2F2F2"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
baseRadius = "8px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#333333"
chartCategoricalColors = ["#FFFFFF", "#D4D4D4", "#A1A1AA", "#737373", "#525252", "#F5F5F5"]
dataframeHeaderBackgroundColor = "#1A1A1A"
dataframeHeaderTextColor = "#F2F2F2"
dataframeBorderColor = "#333333"

[theme.sidebar]
backgroundColor = "#050505"
secondaryBackgroundColor = "#111111"
textColor = "#F2F2F2"
primaryColor = "#606060"
borderColor = "#333333"
codeBackgroundColor = "#1A1A1A"

[server]
headless = true
